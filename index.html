   applied through the `fonts.font(<key>)` SCSS mixin which reads these exact variables.
   Sizes are literal px — never round them. */

  --ui-font-page-title-size:24px;   --ui-font-page-title-weight:500;   --ui-font-page-title-height:32px;

  --ui-font-xxl-size:64px;          --ui-font-xxl-weight:500;          --ui-font-xxl-height:64px;
  --ui-font-xxxl-medium-size:32px;  --ui-font-xxxl-medium-weight:500;  --ui-font-xxxl-medium-height:40px;
  --ui-font-h2-size:20px;           --ui-font-h2-weight:500;           --ui-font-h2-height:32px;

/* Spacing, radii and sizing. Lumana's SCSS has no spacing map — spacing lives in
   `.gap-N` / `.p-N` / `.m-N` utility classes and literal px in component styles.
   These tokens name the values that actually recur in the product. */
:root{
  --space-2:2px;   /* chip inner padding */
  --space-4:4px;
  --space-6:6px;
  --space-8:8px;   /* the default gap between sibling controls */
  --space-12:12px;
  --space-16:16px; /* table cell padding, modal header padding-x */
  --space-20:20px;
  --space-24:24px; /* modal body padding, page section padding */
  --space-25:25px;
  --space-32:32px; /* page gutter in list views */
  --space-40:40px;

  /* radii — Lumana is a low-radius system. 4px is the house radius for nearly everything. */
  --radius-4:4px;    /* buttons, inputs, cards, tables, modals, badges */
  --radius-6:6px;    /* video overlay controls */
  --radius-8:8px;    /* notification panel, icon tiles */
  --radius-10:10px;  /* ui-badge pill */
  --radius-16:16px;  /* camera name label */
  --radius-20:20px;  /* free-text search field */
  --radius-24:24px;  /* tag chip */
  --radius-25:25px;  /* option toggle track */
  --radius-full:9999px;

  /* control heights — border-inclusive height noted in comments, as in ui-button.component.scss */
  --control-h-s:32px;  /* 34px incl. border */
  --control-h-m:38px;  /* 40px incl. border */
  --control-h-l:46px;  /* 48px incl. border */
  --control-h-input:40px;

  /* icon sizes */
  --icon-12:12px; --icon-14:14px; --icon-16:16px; --icon-20:20px; --icon-24:24px;

  /* chrome */
  --sidebar-w:65px;
  --submenu-w:29px;
  --submenu-w-expanded:256px;
  --header-h:49px;
  --row-h-device:52px;
  --row-h-table:72px;
  --row-h-table-compact:40px;

  /* motion */
  --motion-fast:.15s;   /* @kind other */
  --motion-base:.3s;    /* @kind other */
  --motion-slow:.5s;    /* @kind other */
  --easing:ease-in-out; /* @kind other */
}

/* Elevation. Lumana uses very few shadows: an inset hairline for table rows, one "md" card
   shadow, one small selected-tab shadow, and the Material dialog stack. Values verbatim. */
:root{
  /* inset hairline used as a row separator (--box-shadow-default in colors.scss) */
  --box-shadow-default:inset 0 -1px 0 var(--color-secondary-border-shadow);
  /* Shadow/md — hovered table rows, dropdown panels, notification panel */
  --shadow-md:0 4px 8px -2px rgba(15,23,42,.1), 0 2px 4px -2px rgba(15,23,42,.06);
  /* selected segment in a view switcher */
  --shadow-sm:0 1px 3px 0 rgba(16,24,40,.1), 0 1px 2px 0 rgba(16,24,40,.06);
  /* video overlay picker */
  --shadow-overlay:0 4px 12px rgba(0,0,0,.4);
  /* Angular Material dialog stack, as overridden in ui-dropdown.component.scss */
  --shadow-dialog:0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14), 0 9px 46px 8px rgba(0,0,0,.12);
  /* focus glow on the free-text search field */
  --shadow-focus-search:0 0 1px 3px rgba(52,86,224,.15);
  /* left accent bar on toasters/alerts — an inset shadow, not a border */
  --inset-accent-error:3px 0 0 0 #ef4444 inset;
  --inset-accent-info:3px 0 0 0 #3b82f6 inset;
  --inset-accent-success:3px 0 0 0 #22c55e inset;
  --inset-accent-warning:3px 0 0 0 #f59e0b inset;
  /* blur used on video-chrome capsules and mobile headers */
  --blur-chrome:blur(6px);  /* @kind other */
  --blur-panel:blur(10px);  /* @kind other */
}

.drawer{position:absolute;top:0;right:0;bottom:0;width:560px;max-width:calc(100% - 120px);z-index:10;display:flex;flex-direction:column;background:var(--color-elevation-surface-default);border-left:1px solid var(--color-border-default);box-shadow:var(--shadow-md)}
.drawer[hidden]{display:none}
.drawer .close{position:absolute;top:8px;left:-44px;width:32px;height:32px;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--color-secondary-gray-600);color:var(--color-primary-white);transition:opacity var(--motion-base)}
.drawer .close:hover,.drawer .grip:hover{opacity:.85}
.drawer .grip{position:absolute;top:50%;left:-35px;width:14px;height:40px;margin-top:-20px;border-radius:7px;background:var(--color-secondary-gray-600);display:flex;align-items:center;justify-content:center;gap:2px;cursor:col-resize;transition:opacity var(--motion-base)}
.drawer .grip i{width:2px;height:16px;border-radius:1px;background:var(--color-primary-white)}
.drawer .dh{display:flex;align-items:center;flex-shrink:0;height:49px;padding:0 24px;border-bottom:1px solid var(--color-border-default);font-size:16px;line-height:24px;font-weight:500}
.drawer .dh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .db{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.drawer .df{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:16px 24px;border-top:1px solid var(--color-border-default)}
.field{display:flex;flex-direction:column;gap:8px}
.field[hidden]{display:none}
.field>label,.field>.lbl{font-size:12px;line-height:20px;font-weight:500;color:var(--color-text-subtle)}
.field .hint{font-size:12px;line-height:18px;color:var(--color-text-subtlest)}
.field .err{font-size:12px;line-height:18px;color:var(--color-text-alert-default)}
.field.invalid>label{color:var(--color-text-alert-default)}
.field.invalid input{border-color:var(--color-text-alert-default)!important}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.row2[hidden]{display:none}
.inp,.sel{width:100%;box-sizing:border-box;height:40px;padding:7px 16px;font:inherit;font-size:var(--ui-font-xm-size);line-height:var(--ui-font-xm-height);color:var(--color-text-default);background:var(--color-background-input-default);border:1px solid var(--color-border-input-default);border-radius:var(--radius-4);outline:none;transition:border-color var(--motion-base)}
.inp:focus,.sel:focus{border-color:var(--color-border-input-pressed)}
.inp::placeholder{color:var(--color-text-subtlest)}
.selwrap{position:relative}
.sel{appearance:none;-webkit-appearance:none;padding-right:36px;font-weight:500;cursor:pointer;border-color:var(--color-border-input-value)}
.sel option{background:var(--color-elevation-surface-overlay-default);color:var(--color-text-default)}
.selwrap::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid var(--color-icon-default);border-bottom:1.5px solid var(--color-icon-default);transform:rotate(45deg);pointer-events:none}
.swatches{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.swatches button{width:24px;height:24px;padding:0;border:none;border-radius:4px;cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--color-elevation-surface-default),0 0 0 4px var(--color-border-selected-default)}
.swatches .inp{width:110px;height:32px;padding:4px 12px}
.testout{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:4px;border:1px solid var(--color-border-default);background:var(--color-elevation-surface-subtle);font-size:12px;line-height:20px}
.testout[hidden]{display:none}

/* confirm + toast */
.backdrop{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--color-backdrop-dialog)}
.backdrop[hidden]{display:none}
.confirm{width:440px;max-width:100%;display:flex;flex-direction:column;background:var(--color-elevation-surface-overlay-default);border:1px solid var(--color-border-default);border-radius:var(--radius-4);box-shadow:var(--shadow-md);overflow:hidden}
.confirm .ch{padding:16px 24px;font-weight:500;border-bottom:1px solid var(--color-border-default)}
.confirm .cb2{padding:24px;background:var(--color-elevation-surface-overlay-darker);color:var(--color-text-subtle)}
.confirm .cf{display:flex;justify-content:flex-end;gap:8px;padding:20px 24px}
.toast{position:absolute;left:50%;bottom:24px;z-index:30;width:420px;max-width:calc(100% - 32px);transform:translateX(-50%);display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:var(--radius-4);border:1px solid var(--color-border-success-default);background:var(--color-background-success-default);box-shadow:var(--inset-accent-success),var(--shadow-md);font-weight:500;color:var(--color-text-bold);transition:opacity var(--motion-base)}
.toast[hidden]{display:none}
.toast span[class^="ui-icon-"]{font-size:16px;margin-top:4px;color:var(--color-icon-success)}
.toast.error{border-color:var(--color-border-error-default);background:var(--color-background-error-default);box-shadow:var(--inset-accent-error),var(--shadow-md)}
.toast.error span[class^="ui-icon-"]{color:var(--color-text-error-default)}
.toast.info{border-color:var(--color-border-info);background:var(--color-background-information-default);box-shadow:var(--inset-accent-info),var(--shadow-md)}
.toast.info span[class^="ui-icon-"]{color:var(--color-icon-info)}
@media (max-width:900px){.sub{display:none}.rail{display:none}}
</style>

<body>
<div id="app" class="dark-theme">
  <nav class="rail" aria-label="Main">
    <svg class="logo" viewBox="0 0 32 32" aria-label="Lumana" role="img"><path fill="currentColor" d="M30.4099 15.2512C29.6042 15.2671 22.3204 15.3323 19.4941 12.5059C16.6677 9.67958 16.7329 2.39583 16.7488 1.59015L15.1587 0V11.5426C15.1587 13.1623 15.6521 14.281 16.335 15.0549H16.3342C16.3342 15.0549 16.3759 15.1003 16.4457 15.1746C16.4631 15.1928 16.4798 15.211 16.4972 15.2284C16.5677 15.3012 16.6564 15.3914 16.7557 15.4869C17.5325 16.2615 18.6998 16.8421 20.4567 16.8421H31.9992L31.9977 16.8405L30.4091 15.2519L30.4099 15.2512Z"/><path fill="currentColor" d="M12.5059 19.4941C15.3323 22.3204 15.2671 29.6034 15.2512 30.4099L16.8413 32V20.4574C16.8413 18.8377 16.3479 17.719 15.665 16.9452H15.6658C15.6658 16.9452 15.6241 16.8997 15.5543 16.8254C15.5369 16.8072 15.5202 16.789 15.5028 16.7716C15.4323 16.6988 15.3436 16.6086 15.2443 16.5131C14.4675 15.7385 13.3002 15.158 11.5433 15.158H0L1.59015 16.7481C2.39583 16.7322 9.67958 16.667 12.5059 19.4933V19.4941Z"/></svg>

  <main style="flex:1;display:flex;flex-direction:column;min-width:0;min-height:0">

        <button class="btn" type="button" id="exportBtn"><span class="ui-icon-download"></span>Export JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>

    <div style="flex:1;display:flex;min-height:0">
      <aside class="sub" aria-label="Organization settings">
        <div class="grp"><span class="ui-icon-organization"></span><span>Organization</span><span class="ui-icon-expand-arrow" style="margin-left:auto;font-size:12px"></span></div>
        <div class="kids" id="subKids"></div>
        <div id="subMenu" style="display:flex;flex-direction:column;gap:2px"></div>
      </aside>

      <div class="content">
        <section class="cfg" aria-label="GIS configuration">
          <div class="tabsrow">
            <div class="tabs" role="tablist" aria-label="GIS sections" id="tabs"></div>

        <section class="mappane" aria-label="Map preview">
          <div class="maphead">
            <div><b>Map preview</b><small>Live result of the configuration</small></div>
          </div>

            <div class="legend" id="legend">
              <h4>Basemap</h4><div id="pBase"></div>
              <h4>Layers</h4><div id="pLayers"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <aside class="drawer" id="drawer" hidden role="dialog" aria-labelledby="dTitle">
    <button class="close" type="button" id="dClose" aria-label="Close" title="Close"><span class="ui-icon-close" style="font-size:16px"></span></button>
    <div class="grip" id="dGrip" title="Drag to resize"><i></i><i></i></div>
    <div class="dh"><span id="dTitle"></span></div>
    <form class="db" id="dBody" autocomplete="off" onsubmit="return false"></form>
    <div class="df">
      <button class="btn l danger" type="button" id="dDelete">Delete</button>
      <button class="btn l secondary" type="button" id="dTest"><span class="ui-icon-connected"></span>Test</button>
      <span style="flex:1"></span>
      <button class="btn l" type="button" id="dCancel">Cancel</button>
      <button class="btn l primary" type="button" id="dSave">Save</button>
    </div>

  <div class="backdrop" id="confirm" hidden>
    <div class="confirm" role="alertdialog" aria-labelledby="cTitle" aria-describedby="cBody">
      <div class="ch" id="cTitle"></div>
      <div class="cb2" id="cBody"></div>
      <div class="cf"><button class="btn" type="button" id="cNo">Cancel</button><button class="btn" type="button" id="cYes">Delete</button></div>
    </div>

  <div class="toast" id="toast" role="status" hidden><span class="ui-icon-checkmark"></span><div id="toastTxt"></div></div>
</div>

<script>
/* =========================================================
   Config model (kept in this browser; Export / Import as JSON)
   ========================================================= */
const STORE = 'gis-admin-phase1';
const SAMPLE = {
  connections: [
    { id: 'esri',    name: 'Esri ArcGIS Online', url: 'https://server.arcgisonline.com/ArcGIS/rest/services', auth: { type: 'none' } },
    { id: 'demo',    name: 'GeoServer demo',     url: 'https://ahocevar.com/geoserver',                     auth: { type: 'none' } },
    { id: 'mesonet', name: 'Iowa Mesonet',       url: 'https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi', auth: { type: 'none' } },
    { id: 'gibs',    name: 'NASA GIBS',          url: 'https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi', auth: { type: 'none' } },
    { id: 'google',  name: 'Google Maps',        provider: 'google', url: 'https://tile.googleapis.com', auth: { type: 'none' }, google: { key: '', language: 'en-US', region: 'US' } }
  ],
  basemaps: [
    { id: 'dark',  name: 'Dark gray',  conn: 'esri', path: '/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',  maxzoom: 16, attribution: 'Tiles © Esri' },
    { id: 'light', name: 'Light gray', conn: 'esri', path: '/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', maxzoom: 16, attribution: 'Tiles © Esri' },
    { id: 'sat',   name: 'Satellite',  conn: 'esri', path: '/World_Imagery/MapServer/tile/{z}/{y}/{x}',                maxzoom: 19, attribution: 'Tiles © Esri, Maxar' },
    { id: 'groad', name: 'Google roadmap', conn: 'google', google: { mapType: 'roadmap', styles: '' } },
    { id: 'ghyb',  name: 'Google satellite with labels', conn: 'google', google: { mapType: 'hybrid', styles: '' } }
  ],
  defaultBasemap: 'dark',
  layers: [
    { id: 'radar',  name: 'Weather radar (US)', type: 'wms', conn: 'mesonet', path: '',     layerName: 'nexrad-n0r-900913', format: 'image/png', opacity: 0.8, visible: true,  color: '#f59e0b' },
    { id: 'modis',  name: 'Satellite (MODIS)',  type: 'wms', conn: 'gibs',    path: '',     layerName: 'MODIS_Terra_CorrectedReflectance_TrueColor', format: 'image/jpeg', opacity: 0.7, visible: false, color: '#22c55e' },
    { id: 'states', name: 'US states',          type: 'wfs', conn: 'demo',    path: '/wfs', layerName: 'topp:states',       opacity: 1,   visible: true,  color: '#4367f6' },
    { id: 'roads',  name: 'Manhattan roads',    type: 'wfs', conn: 'demo',    path: '/wfs', layerName: 'tiger:tiger_roads', opacity: 1,   visible: false, color: '#ec4899' },
    { id: 'poi',    name: 'Manhattan POIs',     type: 'wfs', conn: 'demo',    path: '/wfs', layerName: 'tiger:poi',         opacity: 1,   visible: false, color: '#eab308' },
    { id: 'gtraffic', name: 'Google traffic',   type: 'google', conn: 'google', overlay: 'layerTraffic', opacity: 1, visible: false }
  ]
};
let cfg = load();
const status = {};      // id -> {cls, text}
let tab = 'connections';
let editing = null;     // {kind, item, draft, isDefault, tried}
const $ = id => document.getElementById(id);

function load() {
  try { const s = localStorage.getItem(STORE); if (s) { const c = JSON.parse(s); if (c && Array.isArray(c.connections)) return c; } } catch (e) {}
  return structuredClone(SAMPLE);
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {} }
const uid = () => Math.random().toString(36).slice(2, 9);
const conn = id => cfg.connections.find(c => c.id === id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const listFor = k => k === 'connection' ? cfg.connections : k === 'basemap' ? cfg.basemaps : cfg.layers;

/* ---------- auth: query params + headers per connection ---------- */
function authParts(c) {
  if (isGoogle(c)) return { query: c.google?.key ? { key: c.google.key } : {}, headers: {} };
  const a = (c && c.auth) || { type: 'none' };
  if (a.type === 'key' && a.key) return { query: { [a.param || 'token']: a.key }, headers: {} };
  if (a.type === 'basic' && a.user) return { query: {}, headers: { Authorization: 'Basic ' + btoa(a.user + ':' + (a.pass || '')) } };
  if (a.type === 'bearer' && a.token) return { query: {}, headers: { Authorization: 'Bearer ' + a.token } };
  return { query: {}, headers: {} };
}
function withQuery(url, q) {
  const parts = Object.entries(q).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v));
  return parts.length ? url + (url.includes('?') ? '&' : '?') + parts.join('&') : url;
}
const AUTH_LABEL = { none: 'None', key: 'API key', basic: 'Basic (user / password)', bearer: 'Bearer token' };

/* ---------- Google Maps Platform (Map Tiles API, 2D tiles) ---------- */
const GURL = 'https://tile.googleapis.com';
function isGoogle(c) { return !!c && c.provider === 'google'; }
const GMAPTYPES = [['roadmap', 'Roadmap'], ['satellite', 'Satellite'], ['hybrid', 'Satellite with labels'], ['terrain', 'Terrain']];
const GOVERLAYS = [['layerTraffic', 'Traffic'], ['layerRoadmap', 'Roads and labels'], ['layerStreetview', 'Street View coverage']];
const sessions = {};  // cache key -> {session, expiry, tileWidth, key}
function basemapBody(b) {
  const t = b.google?.mapType || 'roadmap';
  if (t === 'hybrid') return { mapType: 'satellite', layerTypes: ['layerRoadmap'] };
  if (t === 'terrain') return { mapType: 'terrain', layerTypes: ['layerRoadmap'] };
  let styles; if (t === 'roadmap' && b.google?.styles) { try { styles = JSON.parse(b.google.styles); } catch (e) {} }
  return { mapType: t, styles };
}
const overlayBody = l => ({ mapType: 'roadmap', layerTypes: [l.overlay || 'layerTraffic'], overlay: true });
async function gSession(c, opts) {
  const key = c?.google?.key;
  if (!key) throw new Error('Add an API key to the ' + (c?.name || 'Google') + ' connection');
  const g = c.google || {};
  const body = { mapType: opts.mapType || 'roadmap', language: g.language || 'en-US', region: String(g.region || 'US').toUpperCase(), scale: 'scaleFactor1x' };
  if (opts.layerTypes?.length) body.layerTypes = opts.layerTypes;
  if (opts.overlay) body.overlay = true;
  if (Array.isArray(opts.styles) && opts.styles.length) body.styles = opts.styles;
  const ck = key + JSON.stringify(body), s = sessions[ck];
  if (s && Number(s.expiry) * 1000 > Date.now() + 60000) return s;
  let r;
  try { r = await fetch(GURL + '/v1/createSession?key=' + encodeURIComponent(key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch (e) { throw new Error('Unreachable or blocked by browser'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.session) throw new Error(j.error?.message || ('HTTP ' + r.status));
  return (sessions[ck] = { ...j, key });
}
const gTiles = s => `${GURL}/v1/2dtiles/{z}/{x}/{y}?session=${encodeURIComponent(s.session)}&key=${encodeURIComponent(s.key)}`;
async function gTest(fn) {
  const t0 = performance.now();
  try { await fn(); return { cls: 'ok', text: 'OK · session created · ' + Math.round(performance.now() - t0) + ' ms' }; }
  catch (e) { return { cls: 'err', text: e.message }; }
}

/* ---------- URL builders ---------- */
function basemapUrl(b) { const c = conn(b.conn); return c ? withQuery(c.url + (b.path || ''), authParts(c).query) : ''; }
function wmsTileUrl(l) {
  const c = conn(l.conn);
  const p = new URLSearchParams({ SERVICE: 'WMS', REQUEST: 'GetMap', VERSION: '1.1.1', LAYERS: l.layerName, STYLES: '',
    FORMAT: l.format || 'image/png', TRANSPARENT: 'true', SRS: 'EPSG:3857', WIDTH: '256', HEIGHT: '256' });
  return withQuery(c.url + (l.path || '') + '?' + p.toString(), authParts(c).query) + '&BBOX={bbox-epsg-3857}';
}
function wfsUrl(l) {
  const c = conn(l.conn);
  const p = new URLSearchParams({ service: 'WFS', version: '1.1.0', request: 'GetFeature', typename: l.layerName,
    outputFormat: 'application/json', srsname: 'EPSG:4326', maxFeatures: '5000' });
  return withQuery(c.url + (l.path || '') + '?' + p.toString(), authParts(c).query);
}
function capsUrl(c, path, svc) { return withQuery(c.url + (path || '') + '?SERVICE=' + svc + '&REQUEST=GetCapabilities', authParts(c).query); }

/* ---------- tests (reachability + auth) ---------- */
async function probe(url, headers) {
  const t0 = performance.now();
  try {
    const r = await fetch(url, { headers });
    const ms = Math.round(performance.now() - t0);
    if (r.status === 401 || r.status === 403) return { cls: 'err', text: r.status + ' – check credentials or provider policy' };
    if (!r.ok) return { cls: 'err', text: 'HTTP ' + r.status };
    return { cls: 'ok', text: 'OK · ' + ms + ' ms' };
  } catch (e) { return { cls: 'err', text: 'Unreachable or blocked by browser (CORS)' }; }
}
function testConnection(c) {
  if (isGoogle(c)) return gTest(() => gSession(c, { mapType: 'roadmap' }));
  if (!/^https?:\/\//.test(c.url || ''))return Promise.resolve({ cls: 'err', text: 'Enter a full http(s) address' });
  const h = authParts(c).headers;
  return probe(capsUrl(c, '', 'WMS'), h).then(r => r.cls === 'ok' ? r : probe(withQuery(c.url, authParts(c).query), h));
}
function testBasemap(b) {
  if (!conn(b.conn)) return Promise.resolve({ cls: 'err', text: 'No connection' });
  if (isGoogle(conn(b.conn))) return (async () => {
    try { const s = await gSession(conn(b.conn), basemapBody(b)); return probe(gTiles(s).replace('{z}', '0').replace('{x}', '0').replace('{y}', '0'), {}); }
    catch (e) { return { cls: 'err', text: e.message }; }
  })();
  const url = basemapUrl(b).replace('{z}', '1').replace('{x}', '1').replace('{y}', '0').replace('{s}', 'a');
  return probe(url, authParts(conn(b.conn)).headers);
}
async function testLayer(l) {
  const c = conn(l.conn); if (!c) return { cls: 'err', text: 'No connection' };
  if (l.type === 'google') return isGoogle(c) ? gTest(() => gSession(c, overlayBody(l))) : { cls: 'err', text: 'Choose a Google Maps connection' };
  if (!l.layerName)return { cls: 'err', text: 'Layer name is required' };
  if (l.type === 'wms') return probe(capsUrl(c, l.path, 'WMS'), authParts(c).headers);
  try {
    const t0 = performance.now();
    const r = await fetch(wfsUrl(l).replace('maxFeatures=5000', 'maxFeatures=1'), { headers: authParts(c).headers });
    if (!r.ok) return { cls: 'err', text: 'HTTP ' + r.status };
    await r.json();
    return { cls: 'ok', text: 'OK · GeoJSON · ' + Math.round(performance.now() - t0) + ' ms' };
  } catch (e) { return { cls: 'err', text: 'Failed – unreachable, CORS, or not GeoJSON' }; }
}
const runTest = (kind, item) => kind === 'connection' ? testConnection(item) : kind === 'basemap' ? testBasemap(item) : testLayer(item);

/* =========================================================
   Chrome: rail, settings menu, theme
   ========================================================= */
const RAIL = [['Devices', 'ui-icon-camera-sidebar'], ['Search', 'ui-icon-search-sidebar'], ['Alerts', 'ui-icon-notifications-sidebar'], ['Dashboards', 'ui-icon-dashboard-sidebar'],

function fieldHtml(f) {

function openEditor(kind, item) {

    : kind === 'basemap' ? { name: '', conn: first, path: '', maxzoom: 19, attribution: '', google: { mapType: 'roadmap', styles: '' } }
    : { name: '', type: 'wms', conn: first, path: '', layerName: '', format: 'image/png', color: '#4367f6', overlay: 'layerTraffic', opacity: 1, visible: true };

function readDraft() {

  if (item) { Object.assign(item, d); id = item.id; } else { id = d.id = uid(); list.push(d); }
  if (kind === 'basemap') {
    if (isDefault) cfg.defaultBasemap = id;
    else if (cfg.defaultBasemap === id || !cfg.defaultBasemap) cfg.defaultBasemap = cfg.basemaps.find(b => b.id !== id)?.id || id;
  }
  save(); closeEditor(); rebuildMap();
  toast(`${d.name} was ${item ? 'updated' : 'added'}`);
};
// drag to resize
$('dGrip').addEventListener('mousedown', e => {
  e.preventDefault();
  const dr = $('drawer'), right = dr.getBoundingClientRect().right, max = $('app').clientWidth - 120;
  const move = ev => dr.style.width = Math.max(420, Math.min(max, right - ev.clientX)) + 'px';
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); document.body.style.cursor = ''; };
  document.body.style.cursor = 'col-resize'; addEventListener('mousemove', move); addEventListener('mouseup', up);
});

/* ---------- export / import / reset ---------- */
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'gis-config.json' });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  try {
    const c = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(c.connections) || !Array.isArray(c.basemaps) || !Array.isArray(c.layers)) throw 0;
    cfg = c; save(); closeEditor(); rebuildMap(); toast('Configuration was imported');
  } catch (err) { toast('Not a valid config file', 'error'); }
  e.target.value = '';
};
$('resetBtn').onclick = () => ask({ title: 'Reset to samples', body: 'Are you sure you want to replace your connections, basemaps and layers with the sample setup?', yesText: 'Reset', yes: () => {
  cfg = structuredClone(SAMPLE); Object.keys(status).forEach(k => delete status[k]); save(); closeEditor(); rebuildMap(); toast('Sample setup was restored');
} });

/* =========================================================
   Map preview (live MapLibre)
   ========================================================= */
let map = null, view = { center: [-75, 38], zoom: 2.2 }, build = 0;
const loaded = {};
let gAttrSession = null;  // a Google session currently on screen, used for the copyright text
function transformRequest(url) {
  const c = cfg.connections.find(c => !isGoogle(c) && c.url && url.startsWith(c.url));
  const h = c ? authParts(c).headers : {};
  return Object.keys(h).length ? { url, headers: h } : { url };
}
async function basemapSource(b) {
  const c = conn(b.conn);
  if (isGoogle(c)) {
    const s = await gSession(c, basemapBody(b));
    return { src: { type: 'raster', tiles: [gTiles(s)], tileSize: Number(s.tileWidth) || 256, maxzoom: 22 }, google: s };
  }
  return { src: { type: 'raster', tiles: [basemapUrl(b)], tileSize: 256, maxzoom: b.maxzoom || 19, attribution: b.attribution || '' }, google: null };
}
async function rebuildMap() {
  if (typeof maplibregl === 'undefined') { $('legend').hidden = true; $('map').innerHTML = '<div style="padding:24px;color:var(--color-text-subtle)">The map library could not load. Check your internet connection and reload the page.</div>'; return; }
  const my = ++build;
  if (map) { view = { center: map.getCenter().toArray(), zoom: map.getZoom() }; map.remove(); map = null; }
  Object.keys(loaded).forEach(k => delete loaded[k]);
  gAttrSession = null; updateGoogleAttr();
  const b = cfg.basemaps.find(x => x.id === cfg.defaultBasemap) || cfg.basemaps[0];
  let base = null;
  if (b && conn(b.conn)) { try { base = await basemapSource(b); } catch (e) { toast(`${b.name}: ${e.message}`, 'error'); } }
  if (my !== build) return;  // a newer rebuild started meanwhile
  const style = { version: 8, sources: {}, layers: [] };
  if (base) { style.sources.basemap = base.src; style.layers.push({ id: 'basemap', type: 'raster', source: 'basemap' }); gAttrSession = base.google; }
  else style.layers.push({ id: 'bg', type: 'background', paint: { 'background-color': '#212d3f' } });
  map = new maplibregl.Map({ container: 'map', style, center: view.center, zoom: view.zoom, maxZoom: 22, transformRequest, attributionControl: { compact: true } });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.ScaleControl(), 'bottom-right');
  map.on('load', () => {
    cfg.layers.filter(l => l.type === 'google' && isGoogle(conn(l.conn))).forEach(addGoogleOverlay);
    cfg.layers.filter(l => l.type === 'wms' && conn(l.conn) && !isGoogle(conn(l.conn))).forEach(addWms);
    cfg.layers.filter(l => l.type === 'wfs' && conn(l.conn) && !isGoogle(conn(l.conn))).forEach(addWfs);
    updateGoogleAttr();
  });
  map.on('moveend', updateGoogleAttr);
  renderPanel();
}
async function switchBasemap(id) {
  const b = cfg.basemaps.find(x => x.id === id); if (!b || !map || !map.isStyleLoaded()) return;
  let base;
  try { base = await basemapSource(b); } catch (e) { toast(`${b.name}: ${e.message}`, 'error'); return; }
  if (map.getLayer('basemap')) { map.removeLayer('basemap'); map.removeSource('basemap'); }
  if (map.getLayer('bg')) map.removeLayer('bg');
  map.addSource('basemap', base.src);
  map.addLayer({ id: 'basemap', type: 'raster', source: 'basemap' }, map.getStyle().layers[0]?.id);
  gAttrSession = base.google; updateGoogleAttr();
}
const firstVectorId = () => map.getStyle().layers.find(x => x.id.startsWith('wfs-'))?.id;
function addWms(l) {
  map.addSource('wms-' + l.id, { type: 'raster', tiles: [wmsTileUrl(l)], tileSize: 256 });
  map.addLayer({ id: 'wms-' + l.id, type: 'raster', source: 'wms-' + l.id, layout: { visibility: l.visible ? 'visible' : 'none' }, paint: { 'raster-opacity': l.opacity ?? 1 } }, firstVectorId());
}
const gOverlaySessions = {};  // layer id -> session
async function addGoogleOverlay(l) {
  const id = 'gov-' + l.id, mapAtStart = map;
  try {
    const s = await gSession(conn(l.conn), overlayBody(l));
    if (map !== mapAtStart || map.getSource(id)) return;
    gOverlaySessions[l.id] = s;
    map.addSource(id, { type: 'raster', tiles: [gTiles(s)], tileSize: Number(s.tileWidth) || 256, maxzoom: 22 });
    // Google overlays sit above the basemap and WMS images, under WFS features
    map.addLayer({ id, type: 'raster', source: id, layout: { visibility: l.visible ? 'visible' : 'none' }, paint: { 'raster-opacity': l.opacity ?? 1 } }, firstVectorId());
    setLayerStatus(l.id, 'ok', 'Google tiles');
    updateGoogleAttr();
  } catch (e) { setLayerStatus(l.id, 'err', e.message); }
}
let attrT;
function updateGoogleAttr() {
  const visibleOverlay = map && cfg.layers.find(l => l.type === 'google' && gOverlaySessions[l.id] && map.getLayer('gov-' + l.id) && map.getLayoutProperty('gov-' + l.id, 'visibility') !== 'none');
  const s = gAttrSession || (visibleOverlay && gOverlaySessions[visibleOverlay.id]);
  if (!s || !map) { $('gAttr').hidden = true; return; }
  $('gAttr').hidden = false;
  clearTimeout(attrT);
  attrT = setTimeout(async () => {
    const bb = map.getBounds(), clamp = (v, m) => Math.max(-m + 0.0001, Math.min(m - 0.0001, v));
    const q = new URLSearchParams({ session: s.session, key: s.key, zoom: String(Math.round(map.getZoom())),
      north: clamp(bb.getNorth(), 90), south: clamp(bb.getSouth(), 90), east: clamp(bb.getEast(), 180), west: clamp(bb.getWest(), 180) });
    try {
      const r = await fetch(`${GURL}/tile/v1/viewport?${q}`);
      const j = await r.json();
      $('gAttrTxt').textContent = j.copyright || '';
    } catch (e) { /* keep the last text */ }
  }, 300);
}
const wfsIds = l => ['wfs-' + l.id + '-fill', 'wfs-' + l.id + '-line', 'wfs-' + l.id + '-pt'];
function addWfs(l) {
  const src = 'wfs-' + l.id;
  map.addSource(src, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  const vis = l.visible ? 'visible' : 'none', c = l.color || '#4367f6', op = l.opacity ?? 1;
  const [fill, line, pt] = wfsIds(l);
  map.addLayer({ id: fill, type: 'fill', source: src, filter: ['==', ['geometry-type'], 'Polygon'], layout: { visibility: vis }, paint: { 'fill-color': c, 'fill-opacity': 0.25 * op } });
  map.addLayer({ id: line, type: 'line', source: src, filter: ['!=', ['geometry-type'], 'Point'], layout: { visibility: vis }, paint: { 'line-color': c, 'line-width': 1.5, 'line-opacity': op } });
  map.addLayer({ id: pt, type: 'circle', source: src, filter: ['==', ['geometry-type'], 'Point'], layout: { visibility: vis }, paint: { 'circle-color': c, 'circle-radius': 5, 'circle-stroke-color': '#101828', 'circle-stroke-width': 1, 'circle-opacity': op } });
  [fill, line, pt].forEach(id => {
    map.on('click', id, e => {
      const rows = Object.entries(e.features[0].properties).slice(0, 10).map(([k, v]) => `<tr><td style="color:var(--color-text-subtle)">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
      new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b style="font-weight:500">${esc(l.name)}</b><table>${rows}</table>`).addTo(map);
    });
    map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
  });
  if (l.visible) loadWfs(l, false);
}
async function loadWfs(l, fit) {
  if (loaded[l.id]) return;
  setLayerStatus(l.id, 'run', 'Loading…');
  try {
    const r = await fetch(wfsUrl(l), { headers: authParts(conn(l.conn)).headers });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const gj = await r.json();
    if (!map.getSource('wfs-' + l.id)) return;
    map.getSource('wfs-' + l.id).setData(gj);
    loaded[l.id] = true;
    setLayerStatus(l.id, 'ok', gj.features.length + ' features');
    const bb = fit && bbox(gj); if (bb) map.fitBounds(bb, { padding: 40, maxZoom: 14 });
  } catch (e) { setLayerStatus(l.id, 'err', 'Failed: ' + e.message); }
}
function bbox(gj) {
  let w = 180, s = 90, e = -180, n = -90, any = false;
  const walk = c => { if (typeof c[0] === 'number') { any = true; w = Math.min(w, c[0]); e = Math.max(e, c[0]); s = Math.min(s, c[1]); n = Math.max(n, c[1]); } else c.forEach(walk); };
  gj.features.forEach(f => f.geometry && walk(f.geometry.coordinates));
  return any ? [[w, s], [e, n]] : null;
}
function setLayerVisible(l, on, fit) {
  if (!map || !map.isStyleLoaded()) return;
  const v = on ? 'visible' : 'none';
  if (l.type === 'wms' || l.type === 'google') {
    const id = (l.type === 'wms' ? 'wms-' : 'gov-') + l.id;
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v);
    if (l.type === 'google') updateGoogleAttr();
  } else { wfsIds(l).forEach(id => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', v)); if (on) loadWfs(l, fit); else if (loaded[l.id]) setLayerStatus(l.id, 'ok', 'Hidden'); }
}
function setLayerStatus(id, cls, text) { const el = $('ps-' + id); if (el) el.innerHTML = `<span class="dot ${cls}"></span>${esc(text)}`; }
function renderPanel() {
  $('pBase').innerHTML = cfg.basemaps.map(b => `<div class="pl"><label><input class="radio" type="radio" name="pbase" value="${b.id}" ${b.id === cfg.defaultBasemap ? 'checked' : ''}><span class="nm">${esc(b.name)}</span>${isGoogle(conn(b.conn)) ? '<span class="typ">GOOGLE</span>' : ''}</label></div>`).join('') || '<div class="pl" style="color:var(--color-text-subtlest)">No basemaps</div>';
  $('pLayers').innerHTML = cfg.layers.map(l => `<div class="pl">
      <label class="cb"><input type="checkbox" data-layer="${l.id}" ${l.visible ? 'checked' : ''}><span class="sw" style="background:${esc(layerColor(l))}"></span><span class="nm">${esc(l.name)}</span><span class="typ">${l.type.toUpperCase()}</span></label>
      <div class="st" id="ps-${l.id}"><span class="dot"></span>${l.type === 'wms' ? 'Server-rendered tiles' : l.type === 'google' ? (l.visible ? 'Loading…' : 'Off') : (l.visible ? 'Loading…' : 'Off')}</div>
      <input type="range" min="0" max="1" step="0.05" value="${l.opacity ?? 1}" data-op="${l.id}" aria-label="${esc(l.name)} opacity">
    </div>`).join('') || '<div class="pl" style="color:var(--color-text-subtlest)">No layers</div>';
}
$('legend').addEventListener('input', e => {
  const t = e.target;
  if (t.name === 'pbase') return switchBasemap(t.value);
  const l = cfg.layers.find(x => x.id === (t.dataset.layer || t.dataset.op)); if (!l || !map) return;
  if (t.dataset.layer) return setLayerVisible(l, t.checked, true);
  const o = Number(t.value);
  if (l.type === 'wms' || l.type === 'google') { const id = (l.type === 'wms' ? 'wms-' : 'gov-') + l.id; if (map.getLayer(id)) map.setPaintProperty(id, 'raster-opacity', o); }
  else { const [f, ln, pt] = wfsIds(l); if (map.getLayer(f)) { map.setPaintProperty(f, 'fill-opacity', 0.25 * o); map.setPaintProperty(ln, 'line-opacity', o); map.setPaintProperty(pt, 'circle-opacity', o); } }
});
render();
rebuildMap();
</script>
</body>
